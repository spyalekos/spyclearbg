[project]
name = "spyclearbg"
version = "1.0.6"
description = "AI background removal desktop application using Flet and rembg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.85.3",
    "flet-desktop>=0.85.2",
    "rembg>=2.0.69",
    "pillow>=12.2.0",
    "numba>=0.65.1",
    "llvmlite>=0.47.0",
    "numpy>=2.2.6",
    "onnxruntime>=1.16.0,<1.24.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11.1",
]

[tool.flet]
version = "1.0.6"
build_number = 7
